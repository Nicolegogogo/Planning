<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>升学规划时间线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control bar over one working pane. 工作台 (老师) = 表单 + 预览；学生视图 = 总览 / 按月 / 节点。颜色按方向编码。 */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --fg:#1c2226; --muted:#647079; --line:#dce0e4;
  --accent:#23466b; --accent-fg:#ffffff;
  --c:#4a5563; --c-bg:#eceff2;
  --s:#1f7a5c; --s-bg:#e1f2eb;
  --e:#2b5fa8; --e-bg:#e3ecf8;
  --b:#a3620c; --b-bg:#fbefdc;
  --o:#7b4a8e; --o-bg:#f1e7f5;
  --g:#9b2c3c; --g-bg:#f8e6e9;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --surface:#1a1f25; --fg:#e6e9ec; --muted:#9aa3ad; --line:#2c333b; --accent:#8db4dc; --accent-fg:#10161c;
  --c:#b5bec8; --c-bg:#252c34; --s:#5fc79f; --s-bg:#15302a; --e:#82aee8; --e-bg:#18263a; --b:#e3a24c; --b-bg:#33280f;
  --o:#c79ad9; --o-bg:#2c1f33; --g:#ef8a98; --g-bg:#3a1c22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --surface:#1a1f25; --fg:#e6e9ec; --muted:#9aa3ad; --line:#2c333b; --accent:#8db4dc; --accent-fg:#10161c;
  --c:#b5bec8; --c-bg:#252c34; --s:#5fc79f; --s-bg:#15302a; --e:#82aee8; --e-bg:#18263a; --b:#e3a24c; --b-bg:#33280f;
  --o:#c79ad9; --o-bg:#2c1f33; --g:#ef8a98; --g-bg:#3a1c22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:26px 12px}
h1{font-family:var(--f-display);font-weight:900;font-size:1.85rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:10px}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.group-label{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
button,select,input{font:inherit;color:var(--fg)}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:7px 16px}
button.hl[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
main{padding-block:20px 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.field .lab{font-size:.8rem;color:var(--muted)}
select,input[type=month],input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
.checks label{display:flex;gap:5px;align-items:center;color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbox{font-family:var(--f-mono);font-size:.78rem;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.stat div{font-size:.8rem;color:var(--muted)}
.stat b{display:block;font-family:var(--f-mono);font-size:1.4rem;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.toast{font-size:.82rem;color:var(--s);min-height:1.2em}

/* tracks */
.t-c{--tk:var(--c);--tb:var(--c-bg)} .t-s{--tk:var(--s);--tb:var(--s-bg)} .t-e{--tk:var(--e);--tb:var(--e-bg)}
.t-b{--tk:var(--b);--tb:var(--b-bg)} .t-o{--tk:var(--o);--tb:var(--o-bg)} .t-g{--tk:var(--g);--tb:var(--g-bg)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;color:var(--tk);background:var(--tb);border-radius:4px;padding:0 6px;white-space:nowrap}
.kind{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;white-space:nowrap}
.dim{opacity:.28}

/* month strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.yr{display:flex;flex-direction:column;gap:4px}
.yr-label{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.yr-row{display:flex;gap:4px}
.mbtn{border-radius:8px;padding:6px 0 4px;width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:.8rem}
.mbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.mbtn.node{border-style:dashed;border-color:var(--g)}
.mbtn.past{opacity:.5}
.dots{display:inline-flex;gap:2px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tk)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;color:var(--muted)}
.headline{font-family:var(--f-display);font-weight:900;font-size:1.5rem;line-height:1.35;margin:4px 0 2px;text-wrap:balance}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--tb);transition:opacity .2s}
.task .pill{background:transparent;padding:0}
.done{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
@media (max-width:600px){.task{grid-template-columns:minmax(0,1fr);gap:2px}.headline{font-size:1.25rem}}
.next{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.88rem;color:var(--muted)}
.gate{margin-top:12px;background:var(--g-bg);border-radius:10px;padding:10px 14px;font-size:.9rem}
.gate b{color:var(--g)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}

/* nodes */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.col{border-radius:10px;padding:12px 14px;background:var(--tb);transition:opacity .2s;min-width:0}
.col h3{margin:0 0 6px;font-size:.9rem;color:var(--tk)}
.col ul{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.col .empty{font-size:.85rem;color:var(--muted)}

/* overview */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.phases{grid-template-columns:minmax(0,1fr)}}
.phase{border-top:3px solid var(--accent);padding-top:10px;min-width:0}
.phase .rng{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.phase ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.phase li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px}
.phase li .mm{font-family:var(--f-mono);color:var(--muted);font-size:.78rem;padding-top:2px}
.nodelist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.nodelist li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.nodelist .mm{font-family:var(--f-mono);color:var(--g);font-weight:500}
.nodelist .gt{font-size:.86rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.lib{width:100%;border-collapse:collapse;font-size:.86rem;min-width:640px}
table.lib th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:6px;border-bottom:1px solid var(--line)}
table.lib td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
table.lib td.mm{font-family:var(--f-mono);white-space:nowrap;color:var(--muted)}
textarea{width:100%;min-height:220px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font:inherit;font-size:.86rem;color:var(--fg);resize:vertical}
.poster{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="wrap" id="hdr"></header>
<div class="bar"><div class="wrap" id="bar"></div></div>
<main class="wrap" id="app"></main>

<script>
const PAGE="view";
/* ---------- 任务库：按「入学年 E」的相对时间写，所有届通用 ----------
   [年偏移, 月, 方向, 类型, 任务, 完成标准, 优先级(1最高), 地区]
   方向：c 全体 · s 生化 · e 工科 · b 商科 · o 社科 · m = 数理类(s,e,b)；可写 "s,e"
   年偏移：E-3 = G10 秋季学年开始那一年（如 2029 届 → 2026） */
let LIB=[];
const SRC={X:"张欣凤原表",L:"刘梓童沟通会 + 你的补充",Y:"于明含沟通会 + 你的补充"};
const MOD={c:"全体",s:"生化",e:"工科",b:"商科",o:"社科",g:"决策"};
const MODFULL={s:"生物 / 化学",e:"工程 / 物理 / 数学",b:"商科 / 经济",o:"社科 / 心理 / 教育"};
let REQ={s:"数学 + 生物 + 化学",e:"数学 + 高数 + 物理（+ 化学）",b:"数学 + 经济（高数加分）",o:"待补充"};
let TEST={s:"ESAT",e:"ESAT（数学类方向为 TMUA）",b:"TMUA",o:"待补充"};
const NODES=[
 {yo:-2,mo:3,k:"pick",title:"A-level 选科定案"},
 {yo:-2,mo:6,k:"igcse",title:"IGCSE 收官 · 暑期落地"},
 {yo:-1,mo:1,k:"comp",title:"竞赛季收官 · 证据盘点"},
 {yo:-1,mo:3,k:"lock",title:"锁定英国主方向",r:"uk"},
 {yo:-1,mo:6,k:"launch",title:"大考结束 · 申请季启动"},
 {yo:-1,mo:10,k:"submit",title:"递交与笔试"}
];
const PHASES=[
 {n:"阶段一 · 探索与定向",a:[-3,7],z:[-2,8],goal:"IGCSE 拿高分，用比赛和夏校试出方向"},
 {n:"阶段二 · 专业硬规划",a:[-2,9],z:[-1,8],goal:"A-level 成绩 + 方向证据（竞赛、实践、科研）"},
 {n:"阶段三 · 申请",a:[-1,9],z:[0,1],goal:"文书、笔试、递交、面试"}
];
const BASE=location.href.split("#")[0].replace(/[^/]*$/,"");
/* ---------- 工具 ---------- */
const ym=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;
const addM=(s,n)=>{let[y,m]=s.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return ym(y,m)};
const diffM=(a,b)=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return (by-ay)*12+bm-am};
const now=new Date();const TODAY=ym(now.getFullYear(),now.getMonth()+1);
const fmt=m=>`${m.slice(2,4)}.${+m.slice(5)}`;
const fmtLong=m=>`${m.slice(0,4)} 年 ${+m.slice(5)} 月`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const expand=m=>m==="m"?["s","e","b"]:m.split(",");
const grade=(E,m)=>{const[y,mo]=m.split("-").map(Number);const g=10+(y-(E-3))-(mo>=9?0:1);return g<10?`G${g}暑`:`G${g}`};
const short=t=>t.replace(/（[^）]*）/g,"").split("，")[0].trim();
const rel=(E,yo,mo)=>ym(E+yo,mo);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 学生配置 <-> 链接后缀 ---------- */
const toToken=c=>`e${c.E}-${c.main}-${c.sec||"x"}-${((c.uk?"u":"")+(c.hk?"h":""))||"n"}-j${c.join.replace("-","")}`;
function fromToken(t){const m=/^e(\d{4})-([sebo])-([sebox])-([uhn]+)-j(\d{6})$/.exec(t||"");if(!m)return null;
 return{E:+m[1],main:m[2],sec:m[3]==="x"||m[3]===m[2]?"":m[3],uk:m[4].includes("u"),hk:m[4].includes("h"),join:m[5].slice(0,4)+"-"+m[5].slice(4)}}

/* ---------- 生成个人规划 ---------- */
function plan(c){
 const out=[];
 for(const L of LIB){
  const[yo,mo,mods,kind,title,done,p,r]=L;const ms=expand(mods);
  let tr=null;
  if(ms.includes("c")||(c.sec&&ms.includes(c.main)&&ms.includes(c.sec)))tr="c";else if(ms.includes(c.main))tr=c.main;else if(c.sec&&ms.includes(c.sec))tr=c.sec;
  if(!tr)continue;
  if(r==="uk"&&!c.uk)continue; if(r==="hk"&&!c.hk)continue;
  if(r==="uk"&&tr!=="c"&&tr!==c.main)continue; // 英国只按主方向申请
  const m=rel(c.E,yo,mo); if(m<c.join)continue;
  out.push({m,tr:kind==="决策"?"g":tr,kind,title,done,p});
 }
 return out.sort((a,b)=>a.m<b.m?-1:a.m>b.m?1:a.p-b.p);
}
const endM=c=>rel(c.E,0,1);
const monthsOf=c=>{const a=[];for(let m=c.join;m<=endM(c);m=addM(m,1))a.push(m);return a};
const nodesOf=c=>NODES.filter(n=>!(n.r==="uk"&&!c.uk)).map(n=>({...n,m:rel(c.E,n.yo,n.mo)})).filter(n=>n.m>=c.join);
function headline(ts){const top=ts.filter(t=>t.kind!=="阅读").sort((a,b)=>a.p-b.p).slice(0,2).map(t=>short(t.title));return top.length?top.join(" + "):"校内学习为主，保持节奏"}
function gate(k,c){
 const M=MOD[c.main],S=c.sec?MOD[c.sec]:"";
 switch(k){
 case"pick":return `主方向（${M}）建议科目：${REQ[c.main]}。`+(c.sec?`辅方向（${S}）：${REQ[c.sec]}。两边都保留会加重 A-level 负担，冲突时以主方向为准。`:"");
 case"igcse":return "确认暑期每周安排：夏校、科研或实践、A-level 预学都要有落点。";
 case"comp":return c.sec?`用这一阶段的成绩和投入感受比较两个方向，为后面锁定英国方向准备证据。`:"盘点竞赛与实践成果，开始积累文书素材。";
 case"lock":return c.sec?(c.hk?`英国 UCAS 只能写一份文书，5 个志愿共用：英国全部按主方向（${M}）申请，辅方向（${S}）放到香港，各校分别申请、分别写文书。`:`英国只能写一份文书。没有香港申请时，辅方向（${S}）从这里起转为兴趣保留。`):`英国 5 个志愿围绕 ${M} 定专业，文书主线定稿。`;
 case"launch":return c.uk?`主方向笔试：${TEST[c.main]}，以当年官网为准。`+(c.sec?"辅方向走香港，一般不需要再备英国笔试。":""):"香港申请以成绩、文书和面试为主，暑期集中打磨文书。";
 case"submit":return c.uk?"英国 9 月递交后，10 月完成笔试与香港递交，11–12 月进入面试。":"完成香港申请递交，准备面试。";
 }return""}
function cfgLabel(c){return `${c.E} 届（${String(c.E).slice(2)}Fall 入学） · 主方向 ${MODFULL[c.main]}`+(c.sec?` · 辅方向 ${MODFULL[c.sec]}`:"")+` · ${[c.uk&&"英国",c.hk&&"香港"].filter(Boolean).join(" + ")||"地区未选"}`}

/* ---------- 状态 ---------- */
let mode="studio", studioTab=store.get("st","new"), sv="ov", hl="all", cur=TODAY, curNode=null, fromStudio=false, CFG=null;
let form=store.get("form",{E:2029,main:"s",sec:"b",uk:true,hk:true,join:TODAY});
let grp=store.get("grp",{E:2029,m:addM(TODAY,1),mods:["s","e","b","o"],uk:true,hk:true});
let brand="卓越领航服务";
let libF="all"; let pname=store.get("pname",""); let prange="all";
const pkey=()=>"pers:"+(pname||"_");
let pers=store.get(pkey(),[]); let DL=null; let toastMsg="";

function enterStudent(c,fs){CFG=c;mode="student";fromStudio=fs;const ms=monthsOf(c);cur=ms.includes(TODAY)?TODAY:ms[0];const ns=nodesOf(c);curNode=(ns.find(n=>n.m>=TODAY)||ns[0]||{}).m||null;sv="ov";hl="all"}

/* ---------- 渲染：学生视图 ---------- */
const dimC=tr=>(hl==="all"||tr===hl||tr==="g")?"":" dim";
function trOf(t){return t.tr}
function dotsFor(ts){const s=new Set(ts.map(t=>t.tr==="g"?"c":t.tr));return ["c","s","e","b","o"].filter(x=>s.has(x)).map(x=>`<span class="dot t-${x}"></span>`).join("")}
function taskLi(t){return `<li class="task t-${t.tr}${dimC(t.tr)}"><span class="pill">${MOD[t.tr]}</span><div><span class="kind">${t.kind}</span>${esc(t.title)}<span class="done">完成标准：${esc(t.done)}</span></div></li>`}
function sMonth(P){
 const ms=monthsOf(CFG),ns=nodesOf(CFG),nodeSet=new Set(ns.map(n=>n.m));
 const byY={};ms.forEach(m=>(byY[m.slice(0,4)]??=[]).push(m));
 const strip=`<div class="strip">${Object.entries(byY).map(([y,a])=>`<div class="yr"><span class="yr-label">${y}</span><div class="yr-row">${a.map(m=>`<button class="mbtn${nodeSet.has(m)?" node":""}${m<TODAY?" past":""}" data-m="${m}" aria-pressed="${m===cur}" aria-label="${m}">${+m.slice(5)}月<span class="dots">${dotsFor(P.filter(t=>t.m===m))}</span></button>`).join("")}</div></div>`).join("")}</div>`;
 const ts=P.filter(t=>t.m===cur),i=ms.indexOf(cur),nx=ms[i+1],nd=ns.find(n=>n.m===cur);
 const nextNode=ns.find(n=>n.m>cur);
 return strip+`<section class="card" style="margin-top:12px">
  <div class="eyebrow">${fmtLong(cur)} · ${grade(CFG.E,cur)}${cur===TODAY?" · 本月":""}</div>
  <div class="headline">${esc(headline(ts))}</div>
  ${nd?`<div class="gate"><b>关键节点 · ${nd.title}</b>：${gate(nd.k,CFG)}</div>`:""}
  ${ts.length?`<ul class="tasks">${ts.map(taskLi).join("")}</ul>`:`<p class="sub">本月没有额外任务，专注校内学习。</p>`}
  <div class="next">${nx?`下月预告 · ${fmt(nx)}：${esc(headline(P.filter(t=>t.m===nx)))}`:""}${nextNode?`<br>距离「${nextNode.title}」还有 ${diffM(cur,nextNode.m)} 个月`:""}</div>

   const nd=nodeAt[m];if(!items.length&&!nd)continue;
   const ph=PHASES.find(p=>m>=rel(c.E,...p.a)&&m<=rel(c.E,...p.z));
   if(ph&&ph!==lastPh){lastPh=ph;y+=10;if(draw){ctx.fillStyle="#23466b";roundRect(ctx,L,y,W-2*PAD,52,10);ctx.fill();ctx.fillStyle="#fff";ctx.font=`700 28px ${SANS}`;ctx.fillText(ph.n,L+18,y+36)}y+=68}
   const y0=y;
   if(draw){ctx.fillStyle="#1c2226";ctx.font=`700 30px ${SANS}`;ctx.fillText(fmt(m),L,y+32);ctx.fillStyle="#9aa3ad";ctx.font=`500 22px ${SANS}`;ctx.fillText(grade(c.E,m),L,y+62)}
   if(nd){txt("节点 · "+nd.title,`700 26px ${SANS}`,"#9b2c3c",X,40,TW)}
   for(const it of items){const[fg]=PC[it.k==="g"?"c":it.k]||PC.c;const col=it.k==="g"?"#9b2c3c":fg;
    const tag=(it.own?"★ ":"")+label(it.k)+"  ";ctx.font=`700 24px ${SANS}`;const tw=ctx.measureText(tag).width;
    if(draw){ctx.fillStyle=col;ctx.fillText(tag,X,y+30)}
    const sy=y;txt(it.x,`${it.own?700:400} 26px ${SANS}`,"#1c2226",X+tw,38,TW-tw);y=Math.max(y,sy+38)+4}
   y=Math.max(y,y0+72)+10;if(draw){ctx.fillStyle="#e4e7ea";ctx.fillRect(L,y-6,W-2*PAD,2)}y+=10;
  }
  return y+PAD;};
 cv.width=W;cv.height=4000;const H=run(false);cv.height=Math.ceil(H);
 ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,cv.height);run(true);return cv;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ---------- 导出 ---------- */
function studentDoc(m){const P=plan(CFG).filter(t=>t.m===m);const secs=["g","c",CFG.main,CFG.sec].filter(Boolean).map(k=>({cls:k==="g"?"c":k,label:k==="g"?"决策":k==="c"?"全体":(k===CFG.main?"主方向 · ":"辅方向 · ")+MOD[k],items:P.filter(t=>t.tr===k)})).filter(s=>s.items.length);
 const ms=monthsOf(CFG),nx=ms[ms.indexOf(m)+1],node=nodesOf(CFG).find(n=>n.m>=m);
 return{title:`${+m.slice(5)}月任务提醒`,sub:`${CFG.E} 届 · ${grade(CFG.E,m)} · ${fmtLong(m)}`,focus:headline(P),sections:secs,foot:[nx?`下月预告：${headline(plan(CFG).filter(t=>t.m===nx))}`:"",node?(node.m===m?`本月是关键节点：${node.title}`:`距离「${node.title}」还有 ${diffM(m,node.m)} 个月`):""].filter(Boolean)}}
function csvOf(c){const ns=new Set(nodesOf(c).map(n=>n.m));const q=s=>`"${String(s).replace(/"/g,'""')}"`;
 return "﻿"+["月份,年级,方向,类型,任务,完成标准,关键节点,状态"].concat(plan(c).map(t=>[t.m,grade(c.E,t.m),MOD[t.tr],t.kind,t.title,t.done,ns.has(t.m)?"是":"",""].map(q).join(","))).join("\r\n")}

  case"openStudent":enterStudent({...form},true);render();window.scrollTo(0,0);break;

  case"csvForm":save(`${form.E}届-${MOD[form.main]}${form.sec?"+"+MOD[form.sec]:""}-规划时间线.csv`,csvOf(form));break;
 }

document.addEventListener("change",e=>{
 const el=e.target,d=el.dataset;
 if(d.f){form={...form,[d.f]:el.type==="checkbox"?el.checked:(d.f==="E"?+el.value:el.value)};if(form.sec===form.main)form.sec="";if(!form.join)form.join=TODAY;store.set("form",form);render()}
 else if(d.g){grp={...grp,[d.g]:el.type==="checkbox"?el.checked:(d.g==="E"?+el.value:el.value)};if(!grp.m)grp.m=addM(TODAY,1);store.set("grp",grp);render()}
 else if(d.gm){const s=new Set(grp.mods);el.checked?s.add(d.gm):s.delete(d.gm);grp={...grp,mods:[...s]};store.set("grp",grp);render()}
 else if(el.id==="p-name"){pname=el.value.trim();store.set("pname",pname);pers=store.get(pkey(),[]);render()}
 else if(el.id==="p-range"){prange=el.value}

});
const K={"全体":"c","生化":"s","工科":"e","商科":"b","社科":"o"};
function parseCSV(t){t=t.replace(/^\ufeff/,"");const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=ch}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function toLib(rows){const out=[];for(const r of rows.slice(1)){const[gr,mo,dir,kind,title,done,p,reg,src]=r.map(x=>(x||"").trim());const gn=gr.startsWith("G9")?9:+gr.replace(/\D/g,"");const m=+mo;if(!gn||!m||!title)continue;
 const mods=dir.split(/[、,，\/\s]+/).map(x=>K[x]).filter(Boolean);if(!mods.length)continue;
 out.push([(gn-10)+(m>=9?-3:-2),m,mods.includes("c")?"c":mods.join(","),kind||"任务",title,done||"",+p||2,reg==="英国"?"uk":reg==="香港"?"hk":undefined,src])}return out}
async function boot(){
 try{const[c,j]=await Promise.all([fetch("tasks.csv",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()}),fetch("settings.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({}))]);
  LIB=toLib(parseCSV(c));
  if(j.落款)brand=j.落款; if(Array.isArray(j.可选届别))years=j.可选届别;
  const map=(o,dst)=>{if(o)for(const[k,v]of Object.entries(o))if(K[k])dst[K[k]]=v};map(j.选科建议,REQ);map(j.笔试,TEST);
 }catch(e){document.getElementById("app").innerHTML='<div class="card">没有读到 tasks.csv。请确认它和 index.html 在同一个文件夹，并通过网址（而不是双击文件）打开。</div>';return}
 if(!window.claude)DL={save:async({filename,data})=>{const bl=data instanceof Blob?data:new Blob([data],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(bl);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);return{status:"saved"}}};
 fromHash();
}

boot();
(async()=>{try{DL=await window.claude?.use?.("downloads")}catch(e){DL=null}if(DL)render()})();
